name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token for all jobs
permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck all packages
        run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test all packages
        run: bun test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build all packages
        run: bun run build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            packages/shared/dist
            packages/providers/anyrouter-dev/dist
            packages/providers/aihubmix-com/dist

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist-temp
      - name: Pack all packages
        run: |
          # Pack @pi-extensions/shared
          cp -r dist-temp/packages/shared/dist packages/shared/dist
          cd packages/shared && bash scripts/pack.sh && cd ../..
          # Pack pi-anyrouter-dev
          cp -r dist-temp/packages/providers/anyrouter-dev/dist packages/providers/anyrouter-dev/dist
          cd packages/providers/anyrouter-dev && bash scripts/pack.sh && cd ../../..
          # Pack pi-aihubmix-com
          cp -r dist-temp/packages/providers/aihubmix-com/dist packages/providers/aihubmix-com/dist
          cd packages/providers/aihubmix-com && bash scripts/pack.sh && cd ../../..
      - name: Upload package.tgz artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-tgz
          path: |
            packages/shared/package.tgz
            packages/providers/anyrouter-dev/package.tgz
            packages/providers/aihubmix-com/package.tgz