name: ci
on:
  push: {}
jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
  test:
    name: test
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: build-dist
          path: dist
  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bash scripts/pack.sh
      - name: Upload pi-anyrouter-dev-0.1.0.tgz
        uses: actions/upload-artifact@v7
        with:
          name: pack-pi-anyrouter-dev-0.1.0.tgz
          path: pi-anyrouter-dev-0.1.0.tgz
