name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token for all jobs
permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: packages/pi-anyrouter-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
  test:
    name: test
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 2
    defaults:
      run:
        working-directory: packages/pi-anyrouter-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 2
    defaults:
      run:
        working-directory: packages/pi-anyrouter-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: packages/pi-anyrouter-dev/dist
  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 2
    defaults:
      run:
        working-directory: packages/pi-anyrouter-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: packages/pi-anyrouter-dev/dist
      - run: bash scripts/pack.sh
      - name: Upload package.tgz
        uses: actions/upload-artifact@v4
        with:
          name: package-tgz
          path: package.tgz
