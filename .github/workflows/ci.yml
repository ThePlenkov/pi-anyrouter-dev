name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token for all jobs
permissions:
  contents: read

jobs:
  build-shared:
    name: Build shared package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared package
        run: cd packages/shared && bun run build
      - name: Upload shared dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-dist
          path: packages/shared/dist

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: build-shared
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download shared dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-dist
          path: packages/shared/dist
      - name: Typecheck all packages
        run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download shared dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shared-dist
          path: packages/shared/dist
      - name: Test all packages
        run: bun test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build all packages
        run: bun run build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-dist
          path: |
            packages/shared/dist
            packages/providers/anyrouter-dev/dist
            packages/providers/aihubmix-com/dist
            packages/pi-hub/dist

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-dist
          path: dist-temp
      - name: Pack all packages
        run: |
          # Pack @pi-extensions/shared
          cp -r dist-temp/shared/dist packages/shared/dist
          cd packages/shared && bash scripts/pack.sh && cd ../..
          # Pack pi-anyrouter-dev
          cp -r dist-temp/providers/anyrouter-dev/dist packages/providers/anyrouter-dev/dist
          cd packages/providers/anyrouter-dev && bash scripts/pack.sh && cd ../../..
          # Pack pi-aihubmix-com
          cp -r dist-temp/providers/aihubmix-com/dist packages/providers/aihubmix-com/dist
          cd packages/providers/aihubmix-com && bash scripts/pack.sh && cd ../../..
          # Pack pi-hub
          cp -r dist-temp/pi-hub/dist packages/pi-hub/dist
          cd packages/pi-hub && bash scripts/pack.sh && cd ../../..
      - name: Upload package.tgz artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-tgz
          path: |
            packages/shared/package.tgz
            packages/providers/anyrouter-dev/package.tgz
            packages/providers/aihubmix-com/package.tgz
            packages/pi-hub/package.tgz