name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      specifier:
        description: Force a version specifier (patch, minor, major). Leave at "none" for retry.
        required: false
        type: choice
        default: none
        options: [none, patch, minor, major]

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release)'))
    name: Publish packages via nx release (OIDC)
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Build
        run: bun run build
      - name: Configure git identity for release commits
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - name: Version packages (conventional commits)
        run: |
          gh auth setup-git
          SPEC="${{ github.event.inputs.specifier }}"
          if [ "$SPEC" = "none" ] || [ -z "$SPEC" ]; then
            npx nx release version --git-push=false
          else
            npx nx release version --specifier "$SPEC" --git-push=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish via nx release (OIDC trust, no NPM_TOKEN)
        run: npx nx release publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Push release commit and tags
        run: |
          git push origin HEAD:main
          git push origin --tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
