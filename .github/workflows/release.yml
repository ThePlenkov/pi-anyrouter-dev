name: release

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: Version specifier (patch, minor, major)
        required: true
        type: choice
        options: [patch, minor, major]
      dryRun:
        description: Dry run (skip npm publish and git push)
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish packages via nx release (OIDC)
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Build all packages
        run: bun run build
      - name: Configure git identity for release commits
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - name: Version packages in CI
        run: |
          gh auth setup-git
          SPEC="${{ github.event.inputs.specifier }}"
          if [ -z "$SPEC" ]; then
            # Tag push: derive from tag name
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Tag push detected: $TAG - using existing version"
              # Version is already in package.json from the tag
            else
              echo "Unknown tag format: $TAG"
              exit 1
            fi
          else
            npx nx release version --specifier "$SPEC" --git-push=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish packages via npm (OIDC trust, no NPM_TOKEN)
        if: ${{ !inputs.dryRun }}
        run: |
          # Publish in dependency order: shared first, then providers
          cd packages/shared && npm publish --provenance && cd ../..
          cd packages/providers/anyrouter-dev && npm publish --provenance && cd ../../..
          cd packages/providers/aihubmix-com && npm publish --provenance && cd ../../..
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Push release commit and tags
        if: ${{ !inputs.dryRun && github.event_name == 'workflow_dispatch' }}
        run: |
          git push origin HEAD:main
          git push origin --tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}